<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>標準項目を設定 | RISEN CARE Connect</title>

    <link
        rel="stylesheet"
        href="/style.css?v=20260819-mapping-session-1"
    >
</head>

<body>

    <div id="main-navigation"></div>

    <main class="main-container">

        <section class="mapping-card">

            <div class="section-header">

                <div>
                    <span class="page-step">
                        STEP 3
                    </span>

                    <h1>
                        標準項目を設定
                    </h1>

                    <p>
                        施設データベースのカラムを、
                        AIKO標準項目へ対応付けます。
                    </p>

                    <p class="source-table-label">
                        対象テーブル：
                        <strong id="sourceTableName">
                            care_records
                        </strong>
                    </p>
                </div>

                <button
                    id="saveButton"
                    class="primary-button"
                    type="button"
                >
                    カラムマッピングを保存
                </button>

            </div>

            <div
                id="mappingStatus"
                class="mapping-status"
                aria-live="polite"
            ></div>

            <div class="table-wrapper">

                <table id="mappingTable">

                    <thead>
                        <tr>
                            <th>
                                施設カラム
                            </th>

                            <th>
                                データ型
                            </th>

                            <th>
                                サンプル値
                            </th>

                            <th>
                                AIKO標準項目
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td
                                colspan="4"
                                class="loading-cell"
                            >
                                データを読み込んでいます...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

            <div class="bottom-actions">

    <a
        href="table-mapping.html"
        class="secondary-button"
    >
        前へ：テーブル分類
    </a>

    <a
        href="validation.html"
        class="button-primary"
    >
        次へ：検証
    </a>

</div>

        </section>

    </main>

    <footer class="app-footer">
        © 2026 RISEN CARE Connect
    </footer>

    <script src="/js/common.js?v=20260819-mapping-session-1"></script>

<script src="/js/mapping.js?v=20260819-mapping-session-1"></script>
