<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>テーブル分類 | RISEN CARE Connect</title>

    <link
        rel="stylesheet"
        href="/style.css?v=20260819-table-session-1"
    >
</head>

<body>

    <div id="main-navigation"></div>

    <main class="main-container">

        <section class="mapping-card">

            <div class="section-header">

                <div>
                    <span class="page-step">
                        STEP 2
                    </span>
                    
                    <h1>
                        MySQLテーブルの分類
                    </h1>

                    <p>
                        各テーブルがどの種類の情報を保持しているかを設定します。
                    </p>
                </div>

                <button
                    id="saveButton"
                    class="primary-button"
                    type="button"
                >
                    分類を保存
                </button>

            </div>

            <div
                id="statusMessage"
                class="mapping-status"
                aria-live="polite"
            ></div>

            <div class="table-wrapper">

                <table id="tableMappingTable">

                    <thead>
                        <tr>
                            <th>
                                施設MySQLテーブル
                            </th>

                            <th>
                                RISEN CARE分類
                            </th>

                            <th>
                                カラム設定
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td
                                colspan="3"
                                class="loading-cell"
                            >
                                テーブル情報を読み込んでいます...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

            

            </div>

        </section>

    </main>

    <footer class="app-footer">
        © 2026 RISEN CARE Connect
    </footer>

    <script src="/js/common.js?v=20260819-table-session-1"></script>
