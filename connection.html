<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>接続設定 | RISEN CARE Connect</title>
    <link rel="stylesheet" href="/style.css?v=20260731-1">
</head>

<body>

    <div id="main-navigation"></div>

    <main class="connection-page">

        <section class="connection-card">

            <div class="connection-heading">
                <span class="page-step">STEP 1</span>

                <h1>接続設定</h1>

                <p>
                    接続先となるMySQLデータベースの情報を入力し、
                    接続状態を確認します。
                </p>
            </div>

            <form
                id="connectionForm"
                class="connection-form"
            >

                <div class="form-group">
                    <label for="host">
                        ホスト
                    </label>

                    <input
                        id="host"
                        name="host"
                        type="text"
                        value="localhost"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="port">
                        ポート
                    </label>

                    <input
                        id="port"
                        name="port"
                        type="number"
                        value="3306"
                        min="1"
                        max="65535"
                    >
                </div>

                <div class="form-group">
                    <label for="database">
                        データベース名
                    </label>

                    <input
                        id="database"
                        name="database"
                        type="text"
                        value="risen_care_connect"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="username">
                        ユーザー名
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        value="root"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group form-group--full">
                    <label for="password">
                        パスワード
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                    >

                    <p class="form-help">
                        パスワードを設定していない場合は、空欄のままで構いません。
                    </p>
                </div>

                <div class="connection-form__actions">
                    <button
                        id="connectButton"
                        class="connection-button"
                        type="button"
                    >
                        接続を確認
                    </button>
                </div>

            </form>

            <p
                id="connectionStatus"
                class="connection-status"
                aria-live="polite"
            ></p>

            <div
                id="tableGuide"
                class="guide-message"
                hidden
            >
                次に、取得したテーブル名をクリックしてください。
                選択したテーブルのカラム一覧が表示されます。
            </div>

            <section class="connection-result">

                <div class="result-block">
                    <div class="result-heading">
                        <span class="result-step">STEP 2</span>
                        <h2>取得したテーブル</h2>
                    </div>

                    <ul
                        id="tableList"
                        class="result-list table-list"
                    ></ul>
                </div>

                <div class="result-block">
                    <div class="result-heading">
                        <span class="result-step">STEP 3</span>
                        <h2>カラム一覧</h2>
                    </div>

                    <ul
                        id="columnList"
                        class="result-list column-list"
                    ></ul>
                </div>

            </section>

            <div
    id="nextStepArea"
    class="page-actions"
>
    <a
        id="nextStepButton"
        href="table-mapping.html"
        class="button-primary is-disabled"
        aria-disabled="true"
    >
        次へ：テーブル分類
    </a>
</div>
        </section>

    </main>

    <footer class="app-footer">
        © 2026 RISEN CARE Connect
    </footer>

    <script src="/js/common.js?v=20260731-1"></script>
    <script src="/js/app.js?v=20260731-1"></script>

</body>
</html>
