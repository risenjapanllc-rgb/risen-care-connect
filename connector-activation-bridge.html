<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>RISEN CARE PC接続</title>
  <style>
    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        sans-serif;
      background: #f6f8fa;
      color: #1f2937;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    #status {
      line-height: 1.7;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>RISEN CARE</h1>
      <div id="status">
        このPCの接続情報を確認しています…
      </div>
    </section>
  </main>

  <script>
    const LOCAL_CONNECTOR_BASE =
      'http://127.0.0.1:4310';

    const GAS_ACTIVATION_URL =
      'https://script.google.com/macros/s/' +
      'AKfycbz4VecDKQWG0UONGHL9fjfI5TL2wCSxxx1a63mhsv-_fdjgzSWZ9fxJYAatbv6yLNw' +
      '/exec';

    function showError(message) {
      const status =
        document.getElementById('status');

      status.className = 'error';
      status.textContent = message;
    }

    async function beginActivation() {
      try {
        const response =
          await fetch(
            LOCAL_CONNECTOR_BASE + '/identity',
            {
              method: 'GET',
              cache: 'no-store',
              mode: 'cors',
              targetAddressSpace:
                'loopback'
            }
          );

        if (!response.ok) {
          throw new Error(
            'Local Connectorへ接続できません。'
          );
        }

        const identity =
          await response.json();

        const connectorId =
          identity &&
          typeof identity.connectorId ===
            'string'
            ? identity.connectorId.trim()
            : '';

        if (!connectorId) {
          throw new Error(
            'Connector IDを取得できません。'
          );
        }

        document.getElementById(
          'status'
        ).textContent =
          '施設認証を確認しています…';

        const form =
          document.createElement('form');

        form.method = 'POST';
        form.action = GAS_ACTIVATION_URL;

        const flow =
          document.createElement('input');

        flow.type = 'hidden';
        flow.name = 'flow';
        flow.value = 'connector-activation';

        const connector =
          document.createElement('input');

        connector.type = 'hidden';
        connector.name = 'connectorId';
        connector.value = connectorId;

        form.appendChild(flow);
        form.appendChild(connector);

        document.body.appendChild(form);

        form.submit();

      } catch (error) {
        showError(
          error && error.message
            ? error.message
            : 'このPCの接続を開始できませんでした。'
        );
      }
    }

    beginActivation();
  </script>
</body>
</html>
