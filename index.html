<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RISEN CARE Connect</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div id="main-navigation"></div>

    <main class="container">

        <section class="hero">

            <p class="hero-label">
                AIKO Data Foundation
            </p>

            <h1>
                RISEN CARE Connect
            </h1>

            <p class="hero-description">
                施設で利用しているデータを、<br>
                それぞれの環境に合わせてRISEN CAREへ接続します。
            </p>

        </section>


        <section class="data-source-section">

            <div class="data-source-heading">
                <p class="page-step">
                    STEP 1
                </p>

                <h2>
                    データ接続方法を選択
                </h2>

                <p>
                    施設で現在利用しているデータ管理方法を選択してください。
                </p>
            </div>


            <div class="data-source-grid">

                <a
                    href="connection.html"
                    class="data-source-card"
                >
                    <span class="data-source-card__step">
                        DATABASE
                    </span>

                    <strong>
                        データベース
                    </strong>

                    <span>
                        MySQLなどのデータベースを利用している場合
                    </span>

                    <span class="data-source-card__action">
                        データベースを設定 →
                    </span>
                </a>


                <div
                    class="data-source-card data-source-card--disabled"
                >
                    <span class="data-source-card__step">
                        API
                    </span>

                    <strong>
                        API
                    </strong>

                    <span>
                        他社システムとAPIで接続する場合
                    </span>

                    <span class="data-source-card__status">
                        準備中
                    </span>
                </div>


                <a
                    href="local-connector.html"
                    class="data-source-card"
                >
                    <span class="data-source-card__step">
                        FILE
                    </span>

                    <strong>
                        Word / Excel / CSV
                    </strong>

                    <span>
                        施設PCの登録フォルダからファイルを取り込む場合
                    </span>

                    <span class="data-source-card__action">
                        ファイル取込を設定 →
                    </span>
                </a>

            </div>

        </section>

    </main>

    <script src="js/common.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
