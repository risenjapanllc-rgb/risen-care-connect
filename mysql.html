<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >
    <title>MySQL接続 | RISEN CARE Connect</title>
    <style>
        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            padding: 28px 5vw;
            background: #2457ae;
            color: #fff;
        }

        main {
            max-width: 920px;
            margin: 40px auto;
            padding: 0 24px 60px;
        }

        .card {
            background: #fff;
            border: 1px solid #dce3ee;
            border-radius: 18px;
            padding: 30px;
            box-shadow:
                0 10px 30px
                rgba(25, 45, 80, .06);
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 700;
        }

        .wide {
            grid-column: 1 / -1;
        }

        input,
        select {
            box-sizing: border-box;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cfd8e6;
            border-radius: 9px;
            font: inherit;
        }

        button {
            margin-top: 20px;
            padding: 13px 20px;
            border: 0;
            border-radius: 9px;
            background: #2462c7;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: #e8eef8;
            color: #1e4f9d;
            margin-right: 10px;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        small {
            color: #667085;
            font-weight: 400;
            line-height: 1.6;
        }

        #status {
            margin-top: 20px;
            min-height: 1.5em;
            font-weight: 700;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
<header>
    <strong>RISEN CARE Connect</strong>
</header>

<main>
    <p>DATABASE</p>
    <h1>MySQL接続設定</h1>
    <p>
        施設内のMySQLへLocal Connectorから接続します。
        パスワードはRISEN CAREのWebサーバーには保存しません。
    </p>

    <section class="card">
        <div class="grid">
            <label>
                ホスト
                <input
                    id="host"
                    autocomplete="off"
                    placeholder="192.168.1.10"
                >
            </label>

            <label>
                ポート
                <input
                    id="port"
                    type="number"
                    value="3306"
                >
            </label>

            <label>
                データベース名
                <input
                    id="database"
                    autocomplete="off"
                >
            </label>

            <label>
                ユーザー名
                <input
                    id="user"
                    autocomplete="off"
                >
            </label>

            <label class="wide">
                パスワード
                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                >
            </label>

        </div>

        <button
            id="testButton"
            class="secondary"
            type="button"
        >
            接続を確認
        </button>

        <div
            class="grid"
            style="margin-top: 20px;"
        >
            <label class="wide">
                取込対象テーブル
                <select
                    id="table"
                    disabled
                >
                    <option value="">
                        接続確認後に選択
                    </option>
                </select>
            </label>

            <label class="wide">
                レコード識別列
                <select
                    id="identityField"
                    disabled
                >
                    <option value="">
                        テーブル選択後に確認
                    </option>
                </select>
                <small>
                    全レコードで空欄・重複のない列だけを候補表示します。
                    候補から識別列を一度選択してください。
                </small>
            </label>

            <label class="wide">
                利用者コード列
                <select
                    id="residentCodeField"
                    disabled
                >
                    <option value="">
                        テーブル選択後に選択
                    </option>
                </select>
                <small>
                    RISEN CAREの利用者コードと照合する列を選択してください。
                </small>
            </label>

            <label class="wide">
                利用者氏名列
                <select
                    id="residentNameField"
                    disabled
                >
                    <option value="">
                        テーブル選択後に選択
                    </option>
                </select>
                <small>
                    利用者コード照合時の氏名確認に使用します。
                </small>
            </label>

            <label class="wide">
                生年月日列
                <select
                    id="birthDateField"
                    disabled
                >
                    <option value="">
                        テーブル選択後に選択
                    </option>
                </select>
                <small>
                    RISEN CAREの生年月日に対応するMySQL列を明示的に選択してください。
                    列名から自動推測はしません。
                </small>
            </label>
        </div>

        <button
            id="saveButton"
            type="button"
            disabled
        >
            この接続を保存
        </button>

        <div
            id="status"
            aria-live="polite"
        ></div>
    </section>
</main>

<script src="/js/mysql.js?v=20261009-3"></script>
</body>
</html>
