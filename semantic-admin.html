<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>RISEN CARE | Semantic管理</title>

    <script>
        if (
            new URLSearchParams(
                window.location.search
            ).get("workspace") === "1"
        ) {
            document.documentElement
                .classList
                .add("workspace-embed");
        }
    </script>
<style>
    :root {
        --navy-950: #0b1728;
        --navy-900: #102238;
        --navy-800: #18334f;
        --blue-700: #1769aa;
        --blue-600: #2382c4;
        --teal-600: #0d9488;
        --teal-500: #14b8a6;

        --green-700: #15803d;
        --green-100: #dcfce7;

        --amber-700: #b45309;
        --amber-100: #fef3c7;

        --red-700: #b91c1c;
        --red-100: #fee2e2;

        --slate-900: #172033;
        --slate-700: #46546a;
        --slate-600: #64748b;
        --slate-500: #8190a5;
        --slate-300: #d7dee8;
        --slate-200: #e7ecf2;
        --slate-100: #f3f6f9;
        --white: #ffffff;

        --shadow-sm:
            0 1px 2px rgba(15, 23, 42, 0.05);

        --shadow-md:
            0 10px 30px rgba(15, 35, 60, 0.08);

        --shadow-lg:
            0 22px 55px rgba(15, 35, 60, 0.12);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Hiragino Sans",
            "Yu Gothic UI",
            sans-serif;
        color: var(--slate-900);
        background:
            radial-gradient(
                circle at 10% 0%,
                rgba(35, 130, 196, 0.13),
                transparent 32rem
            ),
            radial-gradient(
                circle at 100% 15%,
                rgba(20, 184, 166, 0.10),
                transparent 34rem
            ),
            #f6f8fb;
        line-height: 1.65;
    }

    main {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0 80px;
    }

    main::before {
        content: "RISEN CARE";
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 11px;
        margin-bottom: 14px;
        border: 1px solid rgba(23, 105, 170, 0.18);
        border-radius: 999px;
        color: var(--blue-700);
        background: rgba(255, 255, 255, 0.8);
        box-shadow: var(--shadow-sm);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
    }

    h1 {
        margin: 0;
        color: var(--navy-950);
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.15;
        letter-spacing: -0.035em;
    }

    h2,
    h3 {
        color: var(--navy-900);
    }

    h2 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
    }

    h3 {
        margin-top: 0;
    }

    .page-description {
        max-width: 760px;
        margin: 14px 0 0;
        color: var(--slate-600);
        font-size: 1rem;
    }

    .workspace-embed body > main > h1,
    .workspace-embed body > main > .page-description {
        display: none;
    }

    .workspace-embed body > main {
        padding-top: 10px;
    }

    .workspace-embed #login-section {
        margin-top: 0;
        padding: 12px 16px;
        border-radius: 14px;
    }

    .workspace-embed #login-section > h2 {
        margin: 0 0 8px;
        font-size: 1rem;
    }

    .workspace-embed #login-section label {
        margin: 8px 0;
    }

    .workspace-embed #login-section input {
        margin-top: 4px;
        padding: 8px 10px;
    }

    .workspace-embed #login-section button {
        padding: 8px 14px;
    }

    .workspace-embed #login-status {
        margin: 6px 0 0;
        font-size: 0.9rem;
        font-weight: 750;
    }

    .workspace-embed #login-section [hidden] {
        display: none !important;
    }

    .workspace-embed #login-section.is-authenticated {
        padding: 8px 14px;
    }

    .workspace-embed
    #login-section.is-authenticated
    > h2 {
        display: none;
    }

    .workspace-embed
    #login-section.is-authenticated
    #login-status {
        margin: 0;
    }


    section {
        margin-top: 32px;
        padding: 28px;
        border: 1px solid rgba(215, 222, 232, 0.9);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(12px);
    }

    #login-section {
        position: relative;
        overflow: hidden;
    }

    #login-section::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background:
            linear-gradient(
                180deg,
                var(--blue-600),
                var(--teal-500)
            );
    }

    #login-section > h2 {
        margin-bottom: 18px;
    }

    #login-section label {
        display: block;
        margin: 14px 0;
        color: var(--slate-700);
        font-size: 0.9rem;
        font-weight: 700;
    }

    input {
        width: 100%;
        margin-top: 6px;
        padding: 11px 13px;
        border: 1px solid var(--slate-300);
        border-radius: 10px;
        outline: none;
        color: var(--slate-900);
        background: var(--white);
        font: inherit;
        transition:
            border-color 0.15s ease,
            box-shadow 0.15s ease;
    }

    input:focus {
        border-color: var(--blue-600);
        box-shadow:
            0 0 0 4px rgba(35, 130, 196, 0.11);
    }

    button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 17px;
        cursor: pointer;
        color: var(--white);
        background:
            linear-gradient(
                135deg,
                var(--blue-700),
                var(--teal-600)
            );
        box-shadow:
            0 8px 20px rgba(23, 105, 170, 0.18);
        font: inherit;
        font-weight: 750;
        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow:
            0 12px 26px rgba(23, 105, 170, 0.23);
    }

    button:active:not(:disabled) {
        transform: translateY(0);
    }

    button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
    }

    #login-status {
        margin: 14px 0 0;
        color: var(--teal-600);
        font-size: 0.92rem;
        font-weight: 750;
    }

    .section-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
    }

    .section-description {
        max-width: 720px;
        margin: 7px 0 0;
        color: var(--slate-600);
        font-size: 0.94rem;
    }

    #reload-candidates-button {
        flex: 0 0 auto;
        margin: 0;
        border: 1px solid var(--slate-300);
        color: var(--navy-800);
        background: var(--white);
        box-shadow: var(--shadow-sm);
    }

    #reload-candidates-button:hover {
        border-color: #b8c4d2;
        background: var(--slate-100);
        box-shadow: var(--shadow-sm);
    }

    .review-queue-header {
        display: flex;
        align-items: center;
        min-height: 46px;
        margin-top: 6px;
        padding: 0 0 12px;
        border-bottom: 1px solid var(--slate-200);
    }

    .review-queue-header h3 {
        position: relative;
        margin: 0;
        padding-left: 16px;
        font-size: 1.05rem;
    }

    .review-queue-header h3::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f59e0b;
        box-shadow:
            0 0 0 5px rgba(245, 158, 11, 0.13);
        transform: translateY(-50%);
    }

    .review-empty {
        margin: 0;
        padding: 26px 18px 30px;
        color: var(--slate-500);
        text-align: center;
    }

    .workspace-focus-candidate {
        outline: 3px solid rgba(20, 184, 166, 0.45);
        outline-offset: 3px;
        box-shadow:
            0 0 0 6px rgba(20, 184, 166, 0.10),
            var(--shadow-md);
    }

    article {
        position: relative;
        margin: 18px 0;
        padding: 22px 22px 20px;
        overflow: hidden;
        border: 1px solid var(--slate-200);
        border-radius: 16px;
        background: var(--white);
        box-shadow: var(--shadow-sm);
        transition:
            border-color 0.15s ease,
            box-shadow 0.15s ease,
            transform 0.15s ease;
    }

    .workspace-embed article {
        margin: 12px 0;
        padding: 18px 18px 16px;
    }

    .workspace-embed article h3 {
        margin-bottom: 8px;
    }

    .workspace-embed article label {
        margin: 10px 0;
    }

    .workspace-embed .review-evidence-panel {
        margin: 12px 0;
    }

    .workspace-embed .review-evidence-row {
        gap: 12px;
        padding: 10px 13px;
    }

    article:hover {
        border-color: #c9d4e1;
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
    }

    article h3 {
        margin-bottom: 10px;
        font-size: 1.05rem;
    }

    article label {
        display: block;
        margin: 14px 0;
    }

    article label span {
        display: block;
        margin-bottom: 4px;
        color: var(--slate-700);
        font-size: 0.86rem;
        font-weight: 750;
    }

    .status-badge {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin: 0 0 12px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 800;
        line-height: 1.2;
    }

    .status-pending {
        color: var(--amber-700);
        background: var(--amber-100);
    }

    .status-accepted {
        color: var(--green-700);
        background: var(--green-100);
    }

    .status-other {
        color: var(--slate-700);
        background: var(--slate-100);
    }

    .review-evidence-panel {
        margin: 16px 0;
        overflow: hidden;
        border: 1px solid var(--slate-200);
        border-radius: 14px;
        background: #fbfcfd;
    }

    .review-evidence-title {
        padding: 11px 15px;
        border-bottom: 1px solid var(--slate-200);
        color: var(--navy-800);
        background: var(--slate-100);
        font-size: 0.82rem;
        font-weight: 850;
        letter-spacing: 0.02em;
    }

    .review-evidence-row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 16px;
        padding: 12px 15px;
        border-bottom: 1px solid var(--slate-200);
    }

    .review-evidence-row:last-child {
        border-bottom: 0;
    }

    .review-evidence-label {
        color: var(--slate-600);
        font-size: 0.82rem;
        font-weight: 750;
    }

    .review-evidence-value {
        color: var(--slate-900);
        font-size: 0.92rem;
        overflow-wrap: anywhere;
    }

    .review-evidence-important {
        background:
            linear-gradient(
                135deg,
                rgba(20, 184, 166, 0.09),
                rgba(35, 130, 196, 0.06)
            );
    }

    .review-evidence-important
    .review-evidence-label {
        color: var(--teal-600);
    }

    .review-evidence-important
    .review-evidence-value {
        color: var(--navy-900);
        font-weight: 750;
    }

    .admin-interpretation-panel {
        margin: 16px 0;
        padding: 16px;
        border: 1px solid var(--slate-200);
        border-radius: 14px;
        background:
            linear-gradient(
                135deg,
                rgba(35, 130, 196, 0.06),
                rgba(20, 184, 166, 0.05)
            );
    }

    .admin-interpretation-title {
        margin-bottom: 5px;
        color: var(--navy-900);
        font-size: 0.92rem;
        font-weight: 850;
    }

    .admin-interpretation-help {
        margin: 0 0 10px;
        color: var(--slate-600);
        font-size: 0.82rem;
        line-height: 1.55;
    }

    .admin-interpretation-input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        margin-bottom: 10px;
        padding: 11px 12px;
        border: 1px solid var(--slate-300);
        border-radius: 10px;
        background: #fff;
        color: var(--slate-900);
        font: inherit;
        line-height: 1.5;
    }

    .admin-interpretation-input:focus {
        outline: 2px solid rgba(35, 130, 196, 0.18);
        border-color: var(--blue-500);
    }

    .admin-interpretation-status {
        min-height: 1.2em;
        margin: 8px 0 0;
        color: var(--teal-600);
        font-size: 0.82rem;
        font-weight: 700;
    }

    .meaning-review-note {
        position: relative;
        margin: 14px 0;
        padding: 17px 18px 17px 20px;
        overflow: hidden;
        border: 1px solid rgba(23, 105, 170, 0.14);
        border-radius: 13px;
        color: var(--navy-800);
        background:
            linear-gradient(
                135deg,
                rgba(35, 130, 196, 0.08),
                rgba(20, 184, 166, 0.07)
            );
    }

    .meaning-review-note::before {
        content: "AI";
        position: absolute;
        top: 14px;
        right: 14px;
        padding: 3px 7px;
        border-radius: 6px;
        color: var(--blue-700);
        background: rgba(255, 255, 255, 0.8);
        font-size: 0.67rem;
        font-weight: 900;
        letter-spacing: 0.06em;
    }

    details {
        margin-top: 16px;
        border-top: 1px solid var(--slate-200);
    }

    details > summary {
        padding: 14px 0;
        cursor: pointer;
        color: var(--navy-800);
        font-weight: 750;
        list-style-position: outside;
    }

    details > summary:hover {
        color: var(--blue-700);
    }

    .accepted-history {
        margin-top: 28px;
        padding: 0;
        border: 1px solid var(--slate-200);
        border-radius: 14px;
        background: #fbfcfd;
    }

    .accepted-history > summary {
        padding: 17px 18px;
        color: var(--green-700);
        font-size: 1rem;
        font-weight: 800;
    }

    .accepted-history > div {
        padding: 0 14px 14px;
    }

    .accepted-history article {
        margin: 10px 0;
        padding: 17px 18px;
        border-color: #e4e9ef;
        background: var(--white);
        box-shadow: none;
    }

    .accepted-history article:hover {
        transform: none;
        box-shadow: var(--shadow-sm);
    }

    @media (max-width: 720px) {
        main {
            width: min(100% - 24px, 1120px);
            padding: 30px 0 50px;
        }

        section {
            padding: 20px;
            border-radius: 16px;
        }

        .section-heading {
            flex-direction: column;
        }

        #reload-candidates-button {
            width: 100%;
        }

        article {
            padding: 18px;
        }

        .review-evidence-row {
            grid-template-columns: 1fr;
            gap: 4px;
        }
    }
</style>
</head>
<body>
    <main>
        <h1>Semantic管理</h1>
        <p class="page-description">
            RISEN CARE全体で使用するMeaningを管理します。
            新しいMeaning候補が発生した場合に、
            AIの判断と施設から得られた情報を確認して審査します。
        </p>

        <section id="login-section">
            <h2>Semantic管理ログイン</h2>

            <label>
                Email
                <input
                    id="admin-email"
                    type="email"
                    value="admin@risencare.local"
                    autocomplete="username"
                >
            </label>

            <label>
                Password
                <input
                    id="admin-password"
                    type="password"
                    autocomplete="current-password"
                >
            </label>

            <button id="admin-login-button">
                ログイン
            </button>

            <p id="login-status"></p>
        </section>

        <section
            id="candidate-section"
            hidden
        >
            <div class="section-heading">
                <div>
                    <h2>Meaning審査</h2>
                    <p class="section-description">
                        新しいMeaning候補を確認します。
                        施設職員がSemanticコードを決める必要はありません。
                    </p>
                </div>

                <button id="reload-candidates-button">
                    再読込
                </button>
            </div>

            <div id="candidate-list"></div>
        </section>
    </main>

    <script src="/js/semantic-admin.js"></script>
</body>
</html>
