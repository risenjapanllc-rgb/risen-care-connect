<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>RISEN Semantic Admin</title>
<style>
    body {
        font-family: system-ui, sans-serif;
        max-width: 960px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.5;
    }

    section {
        margin-top: 32px;
    }

    article {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        margin: 20px 0;
    }

    article label {
        display: block;
        margin: 12px 0;
    }

    article label span {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
    }

    button {
        margin-top: 12px;
        padding: 8px 14px;
        cursor: pointer;
    }

    h3 {
        margin-top: 0;
    }
</style>
</head>
<body>
    <main>
        <h1>RISEN Semantic Admin</h1>

        <section id="login-section">
            <h2>管理者ログイン</h2>

            <label>
                Email
                <input
                    id="admin-email"
                    type="email"
                    value="admin@risencare.local"
                    autocomplete="username"
                >
            </label>

            <label>
                Password
                <input
                    id="admin-password"
                    type="password"
                    autocomplete="current-password"
                >
            </label>

            <button id="admin-login-button">
                ログイン
            </button>

            <p id="login-status"></p>
        </section>

        <section
            id="candidate-section"
            hidden
        >
            <h2>Standard Meaning Candidates</h2>

            <button id="reload-candidates-button">
                再読込
            </button>

            <div id="candidate-list"></div>
        </section>
    </main>

    <script src="/js/semantic-admin.js"></script>
</body>
</html>
