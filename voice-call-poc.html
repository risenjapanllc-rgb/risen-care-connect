<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>RISEN CARE Voice PoC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f4f6f8;
            color: #17202a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .phone {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 12px 40px rgba(0,0,0,.08);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
        }

        .sub {
            margin: 0 0 28px;
            color: #667085;
        }

        .contact {
            border: 1px solid #e4e7ec;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .contact-name {
            font-size: 20px;
            font-weight: 700;
        }

        .contact-note {
            margin-top: 5px;
            color: #667085;
            font-size: 14px;
        }

        .status {
            text-align: center;
            padding: 18px 10px 8px;
            font-size: 17px;
            min-height: 54px;
        }

        .timer {
            text-align: center;
            font-size: 38px;
            font-variant-numeric:
                tabular-nums;
            margin: 8px 0 26px;
        }

        button,
        select {
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .call {
            width: 100%;
            padding: 17px;
            font-size: 18px;
            background: #137a42;
            color: white;
            margin-bottom: 18px;
        }

        .controls {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .secondary {
            padding: 14px;
            background: #eef2f6;
            color: #263238;
        }

        .hangup {
            width: 100%;
            padding: 17px;
            background: #c62828;
            color: white;
            font-size: 18px;
        }

        .device {
            margin: 20px 0;
        }

        .device label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .device select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            background: white;
        }

        .technical {
            margin-top: 20px;
            font-size: 12px;
            color: #98a2b3;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main class="phone">
        <h1>RISEN CARE 電話</h1>
        <p class="sub">
            Vonage Client SDK 通話PoC
        </p>

        <section class="contact">
            <div class="contact-name">
                テスト連絡先
            </div>

            <div class="contact-note">
                電話番号はブラウザへ表示・入力しません
            </div>
        </section>

        <div
            id="status"
            class="status"
            aria-live="polite"
        >
            発信準備完了
        </div>

        <div
            id="timer"
            class="timer"
        >
            00:00
        </div>

        <button
            id="callButton"
            class="call"
            type="button"
        >
            ☎ 電話する
        </button>

        <div class="controls">
            <button
                id="muteButton"
                class="secondary"
                type="button"
                disabled
            >
                ミュート
            </button>

            <button
                id="refreshDevicesButton"
                class="secondary"
                type="button"
            >
                音声出力を更新
            </button>
        </div>

        <div class="device">
            <label for="audioOutput">
                スピーカー・音声出力先
            </label>

            <select
                id="audioOutput"
                disabled
            >
                <option value="">
                    利用可能な出力を確認中
                </option>
            </select>
        </div>

        <button
            id="hangupButton"
            class="hangup"
            type="button"
            disabled
        >
            通話終了
        </button>

        <div class="technical">
            発信先はServer Trust Boundaryが
            caseId / contactIdから決定します。
            ブラウザから電話番号は指定できません。
        </div>
    </main>

    <script src="/vendor/vonage-client-sdk.js"></script>
    <script src="/js/voice-call-poc.js"></script>
</body>
</html>
